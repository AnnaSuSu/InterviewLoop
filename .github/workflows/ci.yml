name: CI

on:
  push:
  pull_request:

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: 安装锁定依赖
        run: bun install --frozen-lockfile
      - name: 类型与架构边界
        run: bun run typecheck && bun run typecheck:node && bun run check:boundaries
      - name: 后端、契约与迁移回归测试
        run: bun run test
      - name: 构建 Bun API
        run: bun run build:api

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: 安装锁定依赖
        run: bun install --frozen-lockfile
      - name: 校验 OpenAPI 生成文件
        run: bun run gen:api && git diff --exit-code -- packages/contracts/openapi.json frontend/src/api/schema.d.ts
      - name: 运行前端回归测试
        run: bun run test:web
      - name: 前端类型与构建
        run: bun run --cwd frontend typecheck && bun run build:web

  desktop-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: 安装锁定依赖
        run: bun install --frozen-lockfile
      - name: 构建 Electron 主进程与 Preload
        run: bun run build:desktop:main
      - name: 编译当前平台 Hono sidecar 与 ONNX Runtime
        run: bun run build:desktop:backend
      - name: 检查桌面运行资源
        run: test -x apps/desktop/resources/backend/techspar-api && test -f apps/desktop/resources/backend/onnxruntime/onnxruntime_binding.node
