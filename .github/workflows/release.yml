name: Release desktop clients

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    name: macOS arm64
    runs-on: macos-14
    env:
      MAC_CSC_LINK_SECRET: ${{ secrets.MAC_CSC_LINK }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: 安装锁定依赖
        run: bun install --frozen-lockfile
      - name: 校验 tag 与产品版本
        run: bun scripts/verify-release-version.ts "${{ github.ref_name }}"
      - name: 构建 Web、Electron 与 arm64 sidecar
        run: |
          bun run build:web
          bun run build:desktop:main
          bun scripts/build-desktop-backend.ts --platform=darwin --arch=arm64
      - name: 构建未签名 macOS 安装包
        if: env.MAC_CSC_LINK_SECRET == ''
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bun run --cwd apps/desktop dist:mac-arm64
      - name: 构建签名并可选公证的 macOS 安装包
        if: env.MAC_CSC_LINK_SECRET != ''
        env:
          CSC_LINK: ${{ env.MAC_CSC_LINK_SECRET }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bun run --cwd apps/desktop dist:mac-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: techspar-macos-arm64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.zip
            dist/desktop/*.blockmap
            dist/desktop/*mac*.yml

  windows-x64:
    name: Windows x64
    runs-on: windows-2025
    env:
      WIN_CSC_LINK_SECRET: ${{ secrets.WIN_CSC_LINK }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - name: 安装锁定依赖
        run: bun install --frozen-lockfile
      - name: 校验 tag 与产品版本
        run: bun scripts/verify-release-version.ts "${{ github.ref_name }}"
      - name: 构建 Web、Electron 与 x64 sidecar
        run: |
          bun run build:web
          bun run build:desktop:main
          bun scripts/build-desktop-backend.ts --platform=win32 --arch=x64
      - name: 构建未签名 Windows 安装包
        if: env.WIN_CSC_LINK_SECRET == ''
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: bun run --cwd apps/desktop dist:win-x64
      - name: 构建签名 Windows 安装包
        if: env.WIN_CSC_LINK_SECRET != ''
        env:
          CSC_LINK: ${{ env.WIN_CSC_LINK_SECRET }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: bun run --cwd apps/desktop dist:win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: techspar-windows-x64
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/desktop/*.exe
            dist/desktop/*.blockmap
            dist/desktop/*.yml

  publish:
    name: Publish GitHub Release
    needs: [macos-arm64, windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: techspar-*
          path: release-assets
          merge-multiple: true
      - name: 生成安装包校验和
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes --title "TechSpar $GITHUB_REF_NAME"
          fi
